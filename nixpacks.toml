[phases.setup]
nixPkgs = ["python39", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "gunicorn sistema_gonnet.wsgi --workers=2 --threads=2 --timeout=120 --max-requests=1000 --max-requests-jitter=50 --log-file -"

