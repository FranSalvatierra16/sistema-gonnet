[phases.setup]
nixPkgs = ["python39", "postgresql"]
aptPkgs = ["libpq-dev"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt"
]

[start]
cmd = "gunicorn sistema_gonnet.wsgi --bind 0.0.0.0:$PORT --workers=2 --threads=2 --timeout=120 --max-requests=1000 --max-requests-jitter=50 --log-file -"
