<div class="mb-3">
    <label class="form-label">Descripción <span class="text-danger">*</span></label>
    <input type="text" name="descripcion" class="form-control" required
           placeholder="Ej: Luz, Gas, Devolución depósito...">
</div>
<div class="row g-2 mb-3">
    <div class="col-md-4">
        <label class="form-label">Tipo</label>
        <select name="tipo_movimiento" class="form-select">
            <option value="egreso" selected>Egreso</option>
            <option value="ingreso">Ingreso</option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Efecto inquilino</label>
        <select name="efecto_inquilino" class="form-select">
            <option value="contra" selected>En contra</option>
            <option value="favor">A favor</option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Operación</label>
        <select name="operacion_monto" class="form-select">
            <option value="resta" selected>Resta</option>
            <option value="suma">Suma</option>
        </select>
    </div>
</div>
<div class="mb-3">
    <label class="form-label">Monto <span class="text-danger">*</span></label>
    <input type="text" name="monto" class="form-control" required placeholder="0.00" oninput="if(typeof formatearNumeroInput==='function')formatearNumeroInput(this)">
</div>
<div class="mb-3">
    <label class="form-label">Fecha</label>
    <input type="date" name="fecha_gasto" class="form-control">
</div>
<div class="mb-3">
    <label class="form-label">Observaciones</label>
    <textarea name="observaciones" class="form-control" rows="2"></textarea>
</div>
<p class="small text-muted mb-0">
    <strong>Resta</strong> descuenta del monto a pagar al propietario; <strong>Suma</strong> lo aumenta.
</p>
