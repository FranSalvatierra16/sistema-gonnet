<div class="mb-3 position-relative">
    <label class="form-label">Concepto <span class="text-danger">*</span></label>
    <input type="text" id="mov_buscar_concepto" class="form-control" autocomplete="off"
           placeholder="Número o nombre del concepto (catálogo de caja)…"
           aria-autocomplete="list" aria-controls="mov_dropdown_conceptos">
    <div id="mov_dropdown_conceptos" class="list-group shadow-sm border rounded mt-1"
         style="display:none;max-height:220px;overflow:auto;z-index:1060;position:absolute;left:0;right:0;"></div>
    <div id="mov_concepto_seleccionado" class="d-none mt-2 alert alert-success py-2 mb-0 small">
        <span id="mov_concepto_texto"></span>
        <button type="button" class="btn-close float-end" id="mov_limpiar_concepto" aria-label="Quitar"></button>
    </div>
    <input type="hidden" name="concepto_id" id="mov_concepto_id" value="">
    <small class="text-muted d-block mt-1">Escribí el número o el nombre y Guardá: se toma solo. O flechas ↑↓ y Enter.</small>
</div>
<div class="mb-3">
    <label class="form-label">Tipo</label>
    <select name="tipo_movimiento" class="form-select">
        <option value="egreso" selected>Egreso — en contra del propietario</option>
        <option value="ingreso">Ingreso — a favor del propietario</option>
    </select>
</div>
<div class="mb-3">
    <label class="form-label" id="movimiento_monto_label">Monto <span class="text-danger">*</span></label>
    <input type="text" name="monto" id="movimiento_monto" class="form-control input-monto-ar"
           required inputmode="decimal" autocomplete="off" placeholder="0,00"
           data-monto-ar="1">
</div>
<div class="mb-3">
    <label class="form-label">Fecha</label>
    <input type="date" name="fecha_gasto" class="form-control">
</div>
<div class="mb-3">
    <label class="form-label">Observaciones</label>
    <textarea name="observaciones" class="form-control" rows="2"></textarea>
</div>
<p class="small text-muted mb-0">
    Elegí un concepto del catálogo de caja. El <strong>ingreso</strong> suma al propietario; el <strong>egreso</strong> descuenta.
</p>
