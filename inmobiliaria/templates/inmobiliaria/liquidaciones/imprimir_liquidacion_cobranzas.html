<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquidación de Cobranzas #{{ liquidacion.id }}</title>
    <style>
        @page { size: A4; margin: 14mm; }
        * { box-sizing: border-box; }
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 11pt;
            color: #000;
            max-width: 190mm;
            margin: 0 auto;
            padding: 10px 14px 24px;
            line-height: 1.35;
        }
        .noprint {
            font-family: system-ui, sans-serif;
            font-size: 13px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        .noprint a, .noprint button {
            margin-right: 10px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .liq-cobranzas-titulo {
            text-align: center;
            font-weight: bold;
            font-size: 13pt;
            letter-spacing: 0.04em;
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        .liq-cobranzas-sub, .liq-cobranzas-meta {
            font-size: 10pt;
            margin-bottom: 4px;
        }
        .liq-cobranzas-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px 16px;
        }
        .liq-cobranzas-tabla {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 10.5pt;
        }
        .liq-cobranzas-tabla th,
        .liq-cobranzas-tabla td {
            border: 1px solid #000;
            padding: 5px 8px;
            vertical-align: top;
        }
        .liq-cobranzas-tabla th {
            text-align: center;
            font-weight: bold;
            background: #f5f5f5;
        }
        .col-detalle { width: 58%; }
        .col-importe { width: 21%; }
        .text-end { text-align: right; }
        .liq-cobranzas-totales td { font-weight: bold; }
        .liq-cobranzas-saldo td {
            border-top: 2px solid #000;
            font-size: 11pt;
            padding: 8px;
        }
        .liq-cobranzas-letras {
            margin: 16px 0 8px;
            font-size: 10.5pt;
        }
        .liq-cobranzas-firmas {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin: 28px 0 12px;
        }
        .liq-cobranzas-firma {
            flex: 1;
            text-align: center;
            font-size: 9pt;
        }
        .liq-cobranzas-linea {
            border-bottom: 1px solid #000;
            height: 36px;
            margin-bottom: 4px;
        }
        @media print {
            .noprint { display: none !important; }
            body { padding: 0; }
        }
    </style>
</head>
<body>
    <div class="noprint">
        {% if volver_url %}
        <a href="{{ volver_url }}">&larr; Volver al detalle</a>
        {% endif %}
        <button type="button" onclick="window.print()">Imprimir</button>
    </div>

    {% include 'inmobiliaria/liquidaciones/_liquidacion_cobranzas_documento.html' %}
</body>
</html>
