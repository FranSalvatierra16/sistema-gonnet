{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Gonnet{% endblock %}</title>
    
    <!-- Bootstrap CSS 5.3.0 - SOLO BOOTSTRAP PURO -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* SOLO ESTILOS BÁSICOS - SIN NADA QUE INTERFIERA CON MODALES */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-container {
            background: white;
            margin: 20px;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
        }
        
        /* NO HAY MÁS CSS PERSONALIZADO QUE PUEDA INTERFERIR */
    </style>
</head>

<body>
    <!-- NAVBAR ULTRA SIMPLE -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'inmobiliaria:dashboard' %}">
                <i class="fas fa-home me-2"></i>Sistema Gonnet
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inmobiliaria:dashboard' %}">
                            <i class="fas fa-home me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inmobiliaria:buscar_propiedades' %}">
                            <i class="fas fa-calendar-plus me-1"></i>🧪 NUEVA RESERVA (Probar Modales)
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inmobiliaria:propiedades' %}">
                            <i class="fas fa-building me-1"></i>Propiedades
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-1"></i>{{ user.username }}
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'admin:logout' %}">
                                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                            </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main>
        <div class="main-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- SOLO BOOTSTRAP JS - NADA MÁS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPT MÍNIMO -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Sistema Gonnet Minimal cargado - Solo Bootstrap puro');
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
