<!-- Modal de Contrato Invierno -->
<div class="modal fade" id="modalContratoInvierno" tabindex="-1" aria-labelledby="modalContratoInviernoLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h4 class="modal-title" id="modalContratoInviernoLabel">
                    ❄️ <strong>Crear Contrato de Alquiler - Invierno (9 meses)</strong>
                </h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formContratoInvierno" method="post">
                {% csrf_token %}
                <input type="hidden" id="propiedad_id_invierno" name="propiedad_id">
                
                <div class="modal-body">
                    <div class="row">
                        <!-- Información de la Propiedad -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header bg-success text-white">
                                    <h5 class="mb-0">🏠 Información de la Propiedad</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-6">
                                            <p><strong>Ficha:</strong> <span id="modal_ficha_invierno">-</span></p>
                                            <p><strong>Dirección:</strong> <span id="modal_direccion_invierno">-</span></p>
                                            <p><strong>Sucursal:</strong> <span id="modal_sucursal_invierno">-</span></p>
                                        </div>
                                        <div class="col-6">
                                            <p><strong>Precio Mensual:</strong> <span id="modal_precio_mensual_invierno">-</span></p>
                                            <p><strong>Expensas:</strong> <span id="modal_expensas_invierno">-</span></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Datos del Contrato -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header bg-warning text-dark">
                                    <h5 class="mb-0">📅 Datos del Contrato</h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-4">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>📅 Fecha Operación:</strong></label>
                                                <input type="date" class="form-control" id="fecha_operacion_invierno" name="fecha_operacion" required>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>🗓️ Fecha Inicio:</strong></label>
                                                <input type="date" class="form-control" id="fecha_inicio_invierno" name="fecha_inicio" required>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>🏁 Fecha Fin:</strong></label>
                                                <input type="date" class="form-control" id="fecha_fin_invierno" name="fecha_fin" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>Duración:</strong></label>
                                                <select class="form-control" id="duracion_meses_invierno" name="duracion_meses">
                                                    <option value="9" selected>9 Meses (Marzo - Diciembre)</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <!-- Espacio para otros campos si es necesario -->
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>Precio Mensual:</strong></label>
                                                <input type="text" class="form-control" id="precio_mensual_input_invierno" name="precio_mensual" required>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="mb-3">
                                                <label class="form-label"><strong>Depósito de Garantía:</strong></label>
                                                <input type="text" class="form-control" id="deposito_garantia_invierno" name="deposito_garantia" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <!-- Inquilino -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-info text-white">
                                    <h5 class="mb-0">👤 Inquilino</h5>
                                </div>
                                <div class="card-body">
                                    <!-- Buscador de Inquilinos -->
                                    <div class="mb-3">
                                        <div class="row mb-2">
                                            <div class="col-8">
                                                <input type="text" id="buscar_inquilino_invierno" placeholder="Buscar por nombre, ID o documento..." 
                                                   class="form-control" oninput="buscarInquilinosEnTiempoRealInvierno()">
                                            </div>
                                            <div class="col-4">
                                                <div class="d-flex gap-2">
                                                    <button type="button" onclick="mostrarModalCrearInquilinoInvierno()" class="btn btn-success">
                                                        ➕ Crear
                                                    </button>
                                                    <button type="button" onclick="buscarTodosLosInquilinosInvierno()" class="btn btn-primary">
                                                        🔍 Todos
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-12">
                                        <select id="inquilino_select_invierno" onchange="actualizarInquilinoIdInvierno()" size="5" name="inquilino_id" required
                                                        class="form-control" style="width: 100%; max-height: 150px; overflow-y: auto;">
                                            <option value="">-- Selecciona un inquilino --</option>
                                            {% for inquilino in inquilinos %}
                                                    <option value="{{ inquilino.id }}" 
                                                            data-nombre="{{ inquilino.nombre|lower }} {{ inquilino.apellido|lower }}" 
                                                            data-id="{{ inquilino.id }}"
                                                            data-dni="{{ inquilino.dni|default:'' }}">
                                                        ID: {{ inquilino.id }} - {{ inquilino.apellido }}, {{ inquilino.nombre }} (DNI: {{ inquilino.dni|default:'N/A' }})
                                            </option>
                                            {% endfor %}
                                        </select>
                                            </div>
                                        </div>
                                        <div id="estado_busqueda_invierno" style="font-size: 14px; color: #666; font-style: italic; min-height: 20px; margin-top: 8px;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Vendedor -->
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-secondary text-white">
                                    <h5 class="mb-0">🏢 Vendedor</h5>
                                </div>
                                <div class="card-body">
                                    <div class="d-flex gap-2 mb-3">
                                        <input type="number" id="vendedor_id_invierno" placeholder="Ingresa ID del vendedor" min="1"
                                               class="form-control" oninput="buscarVendedorAutomaticoInvierno()">
                                        <button type="button" onclick="buscarVendedorInvierno(event)" class="btn btn-primary">🔍 Buscar</button>
                                    </div>
                                    <input type="hidden" id="modalVendedorIdInvierno" name="vendedor_id">
                                    <div id="vendedor_info_invierno" style="display: none;" class="alert alert-success">
                                        <div class="d-flex align-items-center gap-2">
                                            <span style="font-size: 24px;">✅</span>
                                            <div>
                                                <strong>Vendedor encontrado:</strong>
                                                <div id="vendedor_nombre_invierno" class="fw-bold" style="color: #000; font-size: 18px;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        ✅ Crear Contrato de Invierno
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Variable global para el timeout de búsqueda
let busquedaVendedorTimeoutInvierno;

// Función para mostrar el modal de contrato de invierno
function mostrarModalContratoInvierno(propiedadId, direccion, sucursal, precioMensual, precioExpensas) {
    // Llenar los campos del modal
    document.getElementById('propiedad_id_invierno').value = propiedadId;
    document.getElementById('modal_ficha_invierno').textContent = propiedadId;
    document.getElementById('modal_direccion_invierno').textContent = direccion;
    document.getElementById('modal_sucursal_invierno').textContent = sucursal;
    document.getElementById('modal_precio_mensual_invierno').textContent = '$' + precioMensual.toLocaleString('es-AR');
    document.getElementById('modal_expensas_invierno').textContent = precioExpensas ? '$' + precioExpensas.toLocaleString('es-AR') : '-';
    document.getElementById('precio_mensual_input_invierno').value = precioMensual;
    
    // Establecer fecha de operación como hoy
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha_operacion_invierno').value = hoy;
    
    // Establecer fechas de inicio y fin para invierno (marzo a diciembre)
    const añoActual = new Date().getFullYear();
    const añoBase = new Date().getMonth() < 2 ? añoActual - 1 : añoActual; // Si estamos antes de marzo, usar año anterior
    document.getElementById('fecha_inicio_invierno').value = `${añoBase}-03-01`;
    document.getElementById('fecha_fin_invierno').value = `${añoBase}-12-31`;
    
    // Mostrar el modal
    const modal = new bootstrap.Modal(document.getElementById('modalContratoInvierno'));
    modal.show();
}

// Función para buscar inquilinos en tiempo real
function buscarInquilinosEnTiempoRealInvierno() {
    const busqueda = document.getElementById('buscar_inquilino_invierno').value.toLowerCase();
    const select = document.getElementById('inquilino_select_invierno');
    const estadoBusqueda = document.getElementById('estado_busqueda_invierno');
    
    let encontrados = 0;
    Array.from(select.options).forEach(option => {
        if (option.value === '') return; // Skip the default option
        
        const nombre = option.dataset.nombre || '';
        const id = option.dataset.id || '';
        const dni = option.dataset.dni || '';
        
        // Buscar por nombre, ID o DNI
        if (nombre.includes(busqueda) || id.includes(busqueda) || dni.includes(busqueda)) {
            option.style.display = '';
            encontrados++;
        } else {
            option.style.display = 'none';
        }
    });
    
    estadoBusqueda.textContent = `${encontrados} inquilinos encontrados`;
}

function buscarTodosLosInquilinosInvierno() {
    const select = document.getElementById('inquilino_select_invierno');
    Array.from(select.options).forEach(option => {
        option.style.display = '';
    });
    document.getElementById('estado_busqueda_invierno').textContent = 'Mostrando todos los inquilinos';
    document.getElementById('buscar_inquilino_invierno').value = '';
}

function actualizarInquilinoIdInvierno() {
    const select = document.getElementById('inquilino_select_invierno');
    const inquilinoId = select.value;
    
    if (inquilinoId) {
        const selectedOption = select.options[select.selectedIndex];
        const nombre = selectedOption.textContent;
        console.log(`👤 Inquilino seleccionado: ID ${inquilinoId} - ${nombre}`);
        document.getElementById('estado_busqueda_invierno').textContent = `Seleccionado: ${nombre}`;
    }
}

function mostrarModalCrearInquilinoInvierno() {
    console.log('🏠 Abriendo modal crear inquilino desde invierno...');
    // Reutilizar el mismo modal de crear inquilino que ya existe
    mostrarModalCrearInquilino();
    
    // Guardar referencia para actualizar el select correcto después de crear
    window.actualizarSelectInquilino = function(inquilino) {
        const select = document.getElementById('inquilino_select_invierno');
        if (select) {
            const option = document.createElement('option');
            option.value = inquilino.id;
            option.dataset.nombre = `${inquilino.nombre.toLowerCase()} ${inquilino.apellido.toLowerCase()}`;
            option.dataset.id = inquilino.id;
            option.dataset.dni = inquilino.dni || '';
            option.textContent = `ID: ${inquilino.id} - ${inquilino.apellido}, ${inquilino.nombre} (DNI: ${inquilino.dni || 'N/A'})`;
            select.appendChild(option);
            
            // Seleccionar el nuevo inquilino
            select.value = inquilino.id;
            actualizarInquilinoIdInvierno();
        }
    };
}

// Función para buscar vendedor automáticamente
function buscarVendedorAutomaticoInvierno() {
    const vendedorId = document.getElementById('vendedor_id_invierno').value.trim();
    const vendedorInfo = document.getElementById('vendedor_info_invierno');
    
    // Limpiar el timeout anterior
    if (busquedaVendedorTimeoutInvierno) clearTimeout(busquedaVendedorTimeoutInvierno);
    
    // Si no hay ID, ocultar info
    if (!vendedorId) {
        vendedorInfo.style.display = 'none';
        document.getElementById('modalVendedorIdInvierno').value = '';
        return;
    }
    
    // Buscar después de 500ms de no escribir
    busquedaVendedorTimeoutInvierno = setTimeout(() => {
        buscarVendedorInvierno();
    }, 500);
}

// Función para buscar vendedor
function buscarVendedorInvierno(event) {
    const vendedorId = document.getElementById('vendedor_id_invierno').value.trim();
    const vendedorInfo = document.getElementById('vendedor_info_invierno');
    
    if (!vendedorId) {
        alert('❌ Por favor ingresa un ID de vendedor');
        return;
    }
    
    console.log('🔍 Buscando vendedor con ID:', vendedorId);
    
    // Usar la URL correcta de Django
    fetch(`{% url 'inmobiliaria:obtener_vendedor' '0' %}`.replace('0', vendedorId))
        .then(response => response.json())
        .then(data => {
            console.log('📝 Respuesta del servidor:', data);
            
            if (data.success) {
                // Vendedor encontrado - mostrar información
                let nombreVendedor = 'Nombre no disponible';
                
                // Probar diferentes formatos de respuesta
                if (data.nombre) {
                    nombreVendedor = data.nombre;
                } else if (data.vendedor && data.vendedor.nombre_completo) {
                    nombreVendedor = data.vendedor.nombre_completo;
                } else if (data.vendedor && data.vendedor.nombre) {
                    nombreVendedor = data.vendedor.nombre;
                } else if (data.vendedor && data.vendedor.first_name) {
                    nombreVendedor = data.vendedor.first_name + ' ' + (data.vendedor.last_name || '');
                }
                
                console.log('🎯 Nombre extraído:', nombreVendedor);
                
                // Mostrar información del vendedor
                document.getElementById('vendedor_nombre_invierno').textContent = nombreVendedor;
                vendedorInfo.style.display = 'block';
                
                // Guardar el ID del vendedor en el campo oculto
                document.getElementById('modalVendedorIdInvierno').value = vendedorId;
                
                console.log('✅ Vendedor mostrado correctamente');
            } else {
                // Vendedor no encontrado
                document.getElementById('vendedor_nombre_invierno').textContent = '';
                document.getElementById('modalVendedorIdInvierno').value = '';
                vendedorInfo.style.display = 'none';
                
                console.log('❌ Vendedor no encontrado');
                // Solo mostrar alerta si se presionó el botón buscar manualmente
                if (event && event.type === 'click') {
                    alert('❌ Vendedor no encontrado con ID: ' + vendedorId);
                }
            }
        })
        .catch(error => {
            console.error('💥 Error al buscar vendedor:', error);
            document.getElementById('vendedor_nombre_invierno').textContent = '';
            document.getElementById('modalVendedorIdInvierno').value = '';
            vendedorInfo.style.display = 'none';
            
            // Solo mostrar alerta si se presionó el botón buscar manualmente
            if (event && event.type === 'click') {
                alert('💥 Error al buscar vendedor. Intenta de nuevo.');
            }
        });
}

// Manejar el envío del formulario
document.getElementById('formContratoInvierno')?.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    formData.append('duracion_meses', '9'); // Siempre 9 meses para invierno
    
    fetch('{% url "inmobiliaria:crear_contrato_alquiler" %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('✅ Contrato creado exitosamente');
            window.location.href = data.redirect_url;
        } else {
            alert('❌ Error: ' + (data.error || 'Error al crear el contrato'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('❌ Error al crear el contrato');
    });
});
</script>
