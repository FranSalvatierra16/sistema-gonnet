<script>
(function (global) {
    function parseMontoAR(str) {
        if (str === null || str === undefined) return 0;
        var t = String(str).trim();
        if (!t) return 0;
        t = t.replace(/[^\d.,-]/g, '');
        var neg = t.charAt(0) === '-';
        if (neg) t = t.slice(1);
        if (!t) return 0;
        if (t.indexOf(',') >= 0) {
            if (t.indexOf('.') >= 0) {
                t = t.replace(/\./g, '').replace(',', '.');
            } else {
                var parts = t.split(',');
                var last = parts[parts.length - 1];
                if (last.length <= 2) {
                    t = parts.slice(0, -1).join('') + '.' + last;
                } else if (last.length === 3 && parts.length === 2 && parts[0] === '0') {
                    t = parts[0] + '.' + last;
                } else {
                    t = parts.join('');
                }
            }
        } else if (t.indexOf('.') >= 0) {
            var segs = t.split('.');
            if (!(segs.length === 2 && segs[1].length <= 2)) {
                t = t.replace(/\./g, '');
            }
        }
        var n = parseFloat((neg ? '-' : '') + t);
        return isNaN(n) ? 0 : n;
    }
    function formatEnteroConPuntos(n) {
        var neg = n < 0;
        var s = String(Math.abs(parseInt(n, 10) || 0));
        var out = '';
        for (var i = 0; i < s.length; i++) {
            if (i > 0 && (s.length - i) % 3 === 0) out += '.';
            out += s.charAt(i);
        }
        return (neg ? '-' : '') + out;
    }
    function formatMontoAR(num, dec) {
        dec = dec === undefined ? 2 : Math.max(0, dec);
        var n = typeof num === 'number' ? num : parseMontoAR(num);
        if (dec === 0) return formatEnteroConPuntos(Math.round(n));
        var ent = Math.trunc(Math.abs(n));
        var frac = Math.round((Math.abs(n) - ent) * Math.pow(10, dec));
        if (frac >= Math.pow(10, dec)) { ent += 1; frac = 0; }
        var fracStr = String(frac);
        while (fracStr.length < dec) fracStr = '0' + fracStr;
        return (n < 0 ? '-' : '') + formatEnteroConPuntos(ent) + ',' + fracStr;
    }
    function formatMontoARTyping(str) {
        if (str === null || str === undefined) return '';
        var raw = String(str);
        var neg = raw.trim().charAt(0) === '-';
        var t = raw.replace(/[^\d,]/g, '');
        if (!t) return neg ? '-' : '';
        if (t.indexOf(',') >= 0) {
            var parts = t.split(',');
            var intDigits = (parts[0] || '').replace(/\D/g, '');
            var decRaw = parts.slice(1).join('').replace(/\D/g, '').slice(0, 2);
            var formatted = formatEnteroConPuntos(parseInt(intDigits || '0', 10));
            if (t.endsWith(',') && !decRaw) return (neg ? '-' : '') + formatted + ',';
            return (neg ? '-' : '') + formatted + ',' + decRaw;
        }
        var digits = t.replace(/\D/g, '');
        if (!digits) return neg ? '-' : '';
        return (neg ? '-' : '') + formatEnteroConPuntos(parseInt(digits, 10));
    }
    function esInputMonto(el) {
        return el && el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'tel' || !el.type)
            && (el.classList.contains('input-monto-ar') || el.classList.contains('monto') || el.classList.contains('importe-pago'));
    }
    function posicionCursorTrasFormato(oldVal, newVal, selStart) {
        if (typeof selStart !== 'number') return newVal.length;
        var digitsBefore = String(oldVal || '').slice(0, selStart).replace(/[^\d]/g, '').length;
        if (digitsBefore <= 0) return 0;
        var digitCount = 0;
        for (var i = 0; i < newVal.length; i++) {
            if (/\d/.test(newVal.charAt(i))) {
                digitCount++;
                if (digitCount >= digitsBefore) return i + 1;
            }
        }
        return newVal.length;
    }
    function aplicarFormatoTyping(el) {
        if (!el) return;
        var selStart = el.selectionStart;
        var oldVal = el.value;
        var nuevo = formatMontoARTyping(oldVal);
        if (nuevo === oldVal) return;
        el.value = nuevo;
        try {
            el.setSelectionRange(posicionCursorTrasFormato(oldVal, nuevo, selStart), posicionCursorTrasFormato(oldVal, nuevo, selStart));
        } catch (e) {}
    }
    function limpiarCeroAlEnfocar(el) {
        if (!el) return;
        var t = String(el.value || '').trim();
        if (!t || t === '0' || t === '0,00' || t === '0.00' || parseMontoAR(t) === 0) el.value = '';
    }
    function initMontoARInputs(root) {
        (root || document).querySelectorAll('input.input-monto-ar, input.monto, input.importe-pago').forEach(function (el) {
            if (el.readOnly || el.disabled) return;
            if (el.value && String(el.value).trim() !== '' && parseMontoAR(el.value) !== 0) {
                el.value = formatMontoAR(el.value);
            }
        });
    }
    document.addEventListener('input', function (e) {
        if (esInputMonto(e.target)) aplicarFormatoTyping(e.target);
    }, true);
    document.addEventListener('focusin', function (e) {
        if (esInputMonto(e.target)) limpiarCeroAlEnfocar(e.target);
    }, true);
    document.addEventListener('blur', function (e) {
        if (esInputMonto(e.target) && String(e.target.value || '').trim() !== '') {
            e.target.value = formatMontoAR(e.target.value);
        }
    }, true);
    global.parseMontoAR = parseMontoAR;
    global.formatMontoAR = formatMontoAR;
    global.formatMontoARTyping = formatMontoARTyping;
    global.initMontoARInputs = initMontoARInputs;
    function boot() { initMontoARInputs(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
})(window);
</script>
