{% extends 'inmobiliaria/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Nuevo Movimiento de Caja</h2>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'inmobiliaria:caja' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
