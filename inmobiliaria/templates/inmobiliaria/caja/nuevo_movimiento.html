{% extends 'inmobiliaria/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Nuevo Movimiento de Caja</h2>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'inmobiliaria:caja' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#id_propiedad').select2({
        theme: 'bootstrap4',
        width: '100%',
        placeholder: 'Buscar propiedad...',
        allowClear: true,
        ajax: {
            url: '{% url "inmobiliaria:buscar_propiedades_select2" %}',
            dataType: 'json',
            delay: 250,
            data: function(params) {
                return {
                    term: params.term || '',
                    page: params.page || 1
                };
            },
            processResults: function(data) {
                return {
                    results: data.results
                };
            },
            cache: true
        },
        minimumInputLength: 2
    });
});
</script>
{% endblock %}
