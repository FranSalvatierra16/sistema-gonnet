{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Abrir Nueva Caja</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="saldo_inicial">Saldo Inicial:</label>
            <input type="number" 
                   step="0.01" 
                   name="saldo_inicial" 
                   id="saldo_inicial" 
                   class="form-control" 
                   required>
        </div>
        
        <button type="submit" class="btn btn-primary mt-3">
            Abrir Caja
        </button>
    </form>
</div>
{% endblock %}
